    description: q
↓T_Agent_Lire [transactions.SqlTransaction]: 
  comment: Etat annuaire d'une liste de CodeAgent separes par des virgules (prenom, nom, compte AD desactive).
  sqlQuery: |
    SELECT
        r."CodeAgent" AS code_agent,
        COALESCE(r."Prenom", '') AS prenom,
        COALESCE(r."Nom", '') AS nom,
        btrim(concat(COALESCE(r."Nom", ''), ' ', COALESCE(r."Prenom", ''))) AS nom_complet,
        COALESCE(r."Courriel", '') AS mail,
        COALESCE(s."OrgSite", '') AS site,
        COALESCE(p."LibelleService", '') AS libelle_service,
        COALESCE(r."Compte_AD_Desactive", false) AS desactive
    FROM "RET_Agent_Planning" r
    LEFT JOIN "APP_AgentPortefeuille" p ON UPPER(p."CodeAgent") = UPPER(r."CodeAgent")
    LEFT JOIN "APP_OrgSitesRecouv" s ON r."IDSite" = s."ID"
    WHERE '{codes}' <> ''
      AND UPPER(r."CodeAgent") = ANY (string_to_array(UPPER(replace('{codes}', ' ', '')), ','))
    ORDER BY r."CodeAgent"
  ↓codes [variables.RequestableVariable-1797100000001]: 
    description: Liste de CodeAgent separes par des virgules