↓T_Agent_Chercher [transactions.SqlTransaction]: 
  comment: Recherche un agent de l'annuaire par code, prénom ou nom.
  sqlQuery: |
    SELECT
        r."CodeAgent" AS code_agent,
        COALESCE(r."Nom", '') AS nom,
        COALESCE(r."Prenom", '') AS prenom,
        COALESCE(r."Courriel", '') AS mail,
        COALESCE(s."OrgSite", '') AS site,
        COALESCE(p."LibelleService", '') AS libelle_service,
        CASE WHEN COALESCE(btrim(p."LibelleService"), '') = '' THEN 'non' ELSE 'oui' END AS a_mapping,
        'non' AS deja_membre
    FROM "RET_Agent_Planning" r
    LEFT JOIN "APP_AgentPortefeuille" p ON UPPER(p."CodeAgent") = UPPER(r."CodeAgent")
    LEFT JOIN "APP_OrgSitesRecouv" s ON r."IDSite" = s."ID"
    WHERE COALESCE(r."Compte_AD_Desactive", FALSE) = FALSE
      AND (
        '{q}' = ''
        OR r."CodeAgent" ILIKE '%' || '{q}' || '%'
        OR COALESCE(r."Prenom", '') ILIKE '%' || '{q}' || '%'
        OR COALESCE(r."Nom", '') ILIKE '%' || '{q}' || '%'
        OR COALESCE(r."NomComplet", '') ILIKE '%' || '{q}' || '%'
        OR COALESCE(r."Courriel", '') ILIKE '%' || '{q}' || '%'
      )
    ORDER BY 2
    LIMIT 80
