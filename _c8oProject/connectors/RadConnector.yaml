  ↓action [variables.RequestableVariable]: 
    description: creer ou renommer
  ↓node_id [variables.RequestableVariable]: 
    description: Domaine a renommer
  ↓id_perimetre [variables.RequestableVariable]: 
    description: Perimetre
  ↓libelle [variables.RequestableVariable]: 
    description: Nom du domaine
↓T_Terme_Statut [transactions.SqlTransaction]: 
  comment: Passe un terme a valide, refuse ou archive.
  sqlQuery: |
    WITH terme AS (
        SELECT t.id, t.id_perimetre
        FROM "COE_Terme" t
        WHERE t.id = '{terme_id}'
    ),
    droit AS (
        SELECT CASE WHEN EXISTS (
            SELECT 1 FROM "COE_Membre" a
            JOIN terme t ON true
            JOIN "COE_Communaute" p ON p.id = t.id_perimetre
            WHERE a.actif = true
              AND UPPER(a.code_agent) = UPPER('{session_user}')
              AND (
                a.role_session = 'admin'
                OR (a.pilote_communaute = true AND a.id_communaute = p.parent_id)
                OR (a.role_local = 'pilote' AND a.id_perimetre = t.id_perimetre)
              )
        ) THEN 'oui' ELSE 'non' END AS ok
    ),
    maj AS (
        UPDATE "COE_Terme" t
        SET statut = '{statut}'
        WHERE (SELECT ok FROM droit) = 'oui'
          AND t.id = '{terme_id}'
          AND '{statut}' IN ('valide', 'refuse', 'archive')
        RETURNING t.id
    )
    SELECT
        CASE WHEN EXISTS (SELECT 1 FROM maj) THEN 'oui' ELSE 'non' END AS ok,
        CASE
            WHEN '{statut}' NOT IN ('valide', 'refuse', 'archive') THEN 'Statut invalide'
            WHEN (SELECT ok FROM droit) <> 'oui' THEN 'Action non autorisee'
            WHEN NOT EXISTS (SELECT 1 FROM terme) THEN 'Appetence introuvable'
            ELSE ''
        END AS message,
        COALESCE((SELECT id FROM maj LIMIT 1), '') AS terme_id
  ↓session_user [variables.RequestableVariable]: 
    description: Acteur de session
  ↓terme_id [variables.RequestableVariable]: 
    description: Terme
  ↓statut [variables.RequestableVariable]: 
    description: valide, refuse ou archive
