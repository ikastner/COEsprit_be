    description: Acteur de session
  ↓code_agent [variables.RequestableVariable]: 
    description: Agent a ajouter
  ↓id_communaute [variables.RequestableVariable]: 
    description: Communaute
  ↓id_perimetre [variables.RequestableVariable]: 
    description: Perimetre
  ↓role [variables.RequestableVariable]: 
    description: membre, pilote_perimetre ou pilote_communaute
  ↓nom [variables.RequestableVariable]: 
    description: Nom affiche issu de l annuaire
  ↓mail [variables.RequestableVariable]: 
