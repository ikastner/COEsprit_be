        CASE WHEN COALESCE(btrim(a.libelle_service), '') = '' THEN 'non' ELSE 'oui' END AS a_mapping,
        CASE WHEN EXISTS (
            SELECT 1 FROM "COE_Membre" m
            WHERE UPPER(m.code_agent) = UPPER(a.code_agent) AND m.actif = true
        ) THEN 'oui' ELSE 'non' END AS deja_membre
    FROM "COE_Agent" a
    WHERE EXISTS (SELECT 1 FROM acteur s WHERE s.role_session = 'admin' OR s.pilote_communaute = true OR s.role_local = 'pilote')
      AND (
        '{q}' = ''
        OR translate(lower(concat_ws(' ', a.nom, COALESCE(a.mail, ''), a.code_agent)), 'àâäáéèêëïîìôöóùûüüç', 'aaaaeeeeiiiooouuuuc')
           LIKE '%' || translate(lower('{q}'), 'àâäáéèêëïîìôöóùûüüç', 'aaaaeeeeiiiooouuuuc') || '%'
      )
    ORDER BY a.nom
    LIMIT 80
