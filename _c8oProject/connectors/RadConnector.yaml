↓T_Fiche_Lire [transactions.SqlTransaction]: 
  comment: Fiche profil d'un membre (code agent) avec ids termes agrégés.
  sqlQuery: |
    SELECT
        f.user_id,
        f.nom_affiche,
        f.mail_si,
        f.site,
        p.libelle AS perimetre,
        f.id_perimetre,
        f.entite_operationnelle,
        f.libelle_poste,
        f.activites_principales,
        f.sujets_aide,
        f.passions,
        f.canal_mail,
        f.canal_teams,
        f.photo_url,
        f.updated_at,
        m.role_local,
        m.pilote_communaute,
        m.role_session,
        m.actif AS membre_actif,
        c.id AS id_communaute,
        c.libelle AS communaute
    FROM "COE_Fiche" f
    JOIN "COE_Membre" m ON m.code_agent = f.user_id
    JOIN "COE_Communaute" c ON c.id = m.id_communaute
    JOIN "COE_Communaute" p ON p.id = f.id_perimetre
    WHERE UPPER(f.user_id) = UPPER('{user_id}');
