↓T_FicheTermes_Remplacer [transactions.SqlTransaction]: 
  comment: Remplace les appétences cochées sur une fiche (liste terme_id séparés par virgules).
  sqlQuery: |
    WITH wanted AS (
        SELECT DISTINCT btrim(x.tid) AS tid
        FROM unnest(string_to_array(NULLIF(replace('{terme_ids}', ' ', ''), ''), ',')) AS x(tid)
        JOIN "COE_Terme" t ON t.id = btrim(x.tid)
        JOIN "COE_Fiche" f ON UPPER(f.user_id) = UPPER('{user_id}')
        WHERE btrim(x.tid) <> ''
          AND t.id_perimetre = f.id_perimetre
          AND t.statut <> 'archive'
    ),
    suppr AS (
        DELETE FROM "COE_FicheTerme" ft
        WHERE UPPER(ft.fiche_user_id) = UPPER('{user_id}')
          AND NOT EXISTS (SELECT 1 FROM wanted w WHERE w.tid = ft.terme_id)
        RETURNING ft.terme_id
    ),
    ins AS (
        INSERT INTO "COE_FicheTerme" (fiche_user_id, terme_id)
        SELECT f.user_id, w.tid
        FROM wanted w
        JOIN "COE_Fiche" f ON UPPER(f.user_id) = UPPER('{user_id}')
        WHERE NOT EXISTS (
            SELECT 1
            FROM "COE_FicheTerme" ft
            WHERE UPPER(ft.fiche_user_id) = UPPER(f.user_id)
              AND ft.terme_id = w.tid
        )
        ON CONFLICT DO NOTHING
        RETURNING terme_id
    )
    SELECT
        (SELECT COUNT(*) FROM wanted) AS nb_termes,
        EXISTS (SELECT 1 FROM "COE_Fiche" WHERE UPPER(user_id) = UPPER('{user_id}')) AS fiche_existe
    WHERE (SELECT COUNT(*) FROM suppr) >= 0
      AND (SELECT COUNT(*) FROM ins) >= 0;
  ↓user_id [variables.RequestableVariable]: 
    description: Code agent fiche
  ↓terme_ids [variables.RequestableVariable]: 
    description: Ids termes séparés par virgules
↓T_Termes_Proposes_Orphelins [transactions.SqlTransaction]: 
  comment: Supprime les appétences proposées du périmètre que plus aucune fiche n a.
  sqlQuery: |
    DELETE FROM "COE_Terme" t
    WHERE t.statut = 'propose'
      AND t.id_perimetre = (
          SELECT f.id_perimetre
          FROM "COE_Fiche" f
          WHERE UPPER(f.user_id) = UPPER('{user_id}')
      )
      AND NOT EXISTS (
          SELECT 1
          FROM "COE_FicheTerme" ft
          WHERE ft.terme_id = t.id
      )
    RETURNING t.id;
  ↓user_id [variables.RequestableVariable]: 
    description: Code agent de la fiche enregistrée
↓T_Membre_Resoudre [transactions.SqlTransaction]: 
  comment: Résout un membre actif par code agent (connexion SI).
  sqlQuery: |
    SELECT
        m.code_agent AS cle,
        COALESCE(NULLIF(TRIM(f.nom_affiche), ''), NULLIF(TRIM(m.nom_affiche), ''), m.code_agent) AS nom,
        COALESCE(f.photo_url, '') AS photo_url,
        m.code_agent AS cle_externe,
        m.role_session AS code_role,
        m.role_local,
        m.pilote_communaute,
        c.id AS id_communaute,
        c.libelle AS communaute,
        m.id_perimetre,
        p.libelle AS perimetre
    FROM "COE_Membre" m
    JOIN "COE_Communaute" c ON c.id = m.id_communaute
    JOIN "COE_Communaute" p ON p.id = m.id_perimetre
    LEFT JOIN "COE_Fiche" f ON UPPER(f.user_id) = UPPER(m.code_agent)
    WHERE '{code}' <> ''
      AND UPPER(m.code_agent) = UPPER('{code}')
      AND m.actif = true
      AND c.active = true
      AND p.active = true
    LIMIT 1;
  ↓code [variables.RequestableVariable]: 
    description: Code agent SI
↓T_Membre_Test [transactions.SqlTransaction]: 
  ↑default: true
  comment: Résolution membre hors SI (code agent ou id interne, filtre rôle optionnel).
  sqlQuery: |
    SELECT
        m.code_agent AS cle,
        COALESCE(NULLIF(TRIM(f.nom_affiche), ''), NULLIF(TRIM(m.nom_affiche), ''), m.code_agent) AS nom,
        COALESCE(f.photo_url, '') AS photo_url,
        m.code_agent AS cle_externe,
        m.role_session AS code_role,
        m.role_local,
        m.pilote_communaute,
        c.id AS id_communaute,
        c.libelle AS communaute,
        m.id_perimetre
    FROM "COE_Membre" m
    JOIN "COE_Communaute" c ON c.id = m.id_communaute
    LEFT JOIN "COE_Fiche" f ON UPPER(f.user_id) = UPPER(m.code_agent)
    WHERE m.actif = true
      AND c.active = true
      AND (
        '{cle}' = ''
        OR UPPER(m.code_agent) = UPPER('{cle}')
        OR m.id::text = '{cle}'
      )
      AND ('{role}' = '' OR UPPER(m.role_session) = UPPER('{role}'))
    ORDER BY m.nom_affiche
    LIMIT 1;
  ↓cle [variables.RequestableVariable]: 
    description: Code agent ou id membre
  ↓role [variables.RequestableVariable]: 
    description: membre, pilote ou admin (optionnel)
↓T_Recherche_Profils [transactions.SqlTransaction]: 
  comment: Recherche de fiches membres actifs d'une communauté (texte, site, périmètre, domaine).
  sqlQuery: |
    SELECT DISTINCT
        f.user_id,
        f.nom_affiche,
        f.mail_si,
        f.site,
        p.libelle AS perimetre,
        f.id_perimetre,
        f.entite_operationnelle,
        f.libelle_poste,
        f.activites_principales,
        f.photo_url,
        f.updated_at,
        c.libelle AS communaute,
        m.role_local,
        COALESCE(
            (SELECT string_agg(ft.terme_id, ',' ORDER BY ft.terme_id)
             FROM "COE_FicheTerme" ft
             WHERE ft.fiche_user_id = f.user_id),
            ''
        ) AS terme_ids,
        COALESCE(
            (SELECT string_agg(t.libelle, '|' ORDER BY ft.terme_id)
             FROM "COE_FicheTerme" ft
             JOIN "COE_Terme" t ON t.id = ft.terme_id
             WHERE ft.fiche_user_id = f.user_id),
            ''
        ) AS terme_libelles,
        COALESCE(
            (SELECT string_agg(DISTINCT (d.id || '::' || d.libelle || '::' || COALESCE(d.tone, 'sky')), '|' ORDER BY (d.id || '::' || d.libelle || '::' || COALESCE(d.tone, 'sky')))
             FROM "COE_FicheTerme" ft
             JOIN "COE_Terme" t ON t.id = ft.terme_id
             JOIN "COE_Domaine" d ON d.id = t.domaine_id
             WHERE ft.fiche_user_id = f.user_id),
            ''
        ) AS domaine_chips
    FROM "COE_Fiche" f
    JOIN "COE_Membre" m ON m.code_agent = f.user_id
    JOIN "COE_Communaute" c ON c.id = m.id_communaute
    JOIN "COE_Communaute" p ON p.id = f.id_perimetre
    LEFT JOIN "COE_FicheTerme" ft ON ft.fiche_user_id = f.user_id
    LEFT JOIN "COE_Terme" t ON t.id = ft.terme_id
    WHERE m.actif = true
      AND c.active = true
      AND p.active = true
      AND ('{id_communaute}' = '' OR c.id = '{id_communaute}')
      AND ('{site}' = '' OR f.site = ANY (string_to_array('{site}', '|')))
      AND ('{libelle_poste}' = '' OR f.libelle_poste = ANY (string_to_array('{libelle_poste}', '|')))
      AND ('{entite}' = '' OR f.entite_operationnelle = ANY (string_to_array('{entite}', '|')))
      AND (
        '{perimetre}' = ''
        OR p.id = '{perimetre}'
        OR p.libelle = '{perimetre}'
      )
      AND (
        '{domaine_id}' = ''
        OR EXISTS (
          SELECT 1
          FROM "COE_FicheTerme" ftd
          JOIN "COE_Terme" td ON td.id = ftd.terme_id
          WHERE ftd.fiche_user_id = f.user_id
            AND td.domaine_id = ANY (string_to_array('{domaine_id}', '|'))
        )
      )
      AND ('{terme_id}' = '' OR ft.terme_id = ANY (string_to_array('{terme_id}', '|')))
      AND (
        '{q}' = ''
        OR translate(lower(concat_ws(' ',
          f.nom_affiche,
          COALESCE(f.mail_si, ''),
          COALESCE(f.libelle_poste, ''),
          COALESCE(f.activites_principales, ''),
          COALESCE(f.sujets_aide, ''),
          COALESCE(f.passions, ''),
          COALESCE(f.site, ''),
          COALESCE(f.entite_operationnelle, ''),
          COALESCE(p.libelle, ''),
          COALESCE(c.libelle, ''),
          COALESCE((
            SELECT string_agg(t2.libelle, ' ')
            FROM "COE_FicheTerme" ft2
            JOIN "COE_Terme" t2 ON t2.id = ft2.terme_id
            WHERE ft2.fiche_user_id = f.user_id
          ), ''),
          COALESCE((
            SELECT string_agg(DISTINCT d2.libelle, ' ')
            FROM "COE_FicheTerme" ft3
            JOIN "COE_Terme" t3 ON t3.id = ft3.terme_id
            JOIN "COE_Domaine" d2 ON d2.id = t3.domaine_id
            WHERE ft3.fiche_user_id = f.user_id
          ), '')
        )), 'àâäáéèêëïîìôöóùûüüç', 'aaaaeeeeiiiooouuuuc')
        LIKE '%' || translate(lower('{q}'), 'àâäáéèêëïîìôöóùûüüç', 'aaaaeeeeiiiooouuuuc') || '%'
      )
    ORDER BY f.nom_affiche;
  ↓q [variables.RequestableVariable]: 
    description: Texte libre
  ↓id_communaute [variables.RequestableVariable]: 
    description: Id communauté parente
  ↓site [variables.RequestableVariable]: 
    description: Sites séparés par |, vide = tous
  ↓libelle_poste [variables.RequestableVariable]: 
    description: Filtre libellé du poste
  ↓entite [variables.RequestableVariable]: 
    description: Filtre entité opérationnelle
  ↓perimetre [variables.RequestableVariable]: 
    description: Id ou libellé du périmètre de travail
  ↓domaine_id [variables.RequestableVariable]: 
    description: Filtre domaine appétence
  ↓terme_id [variables.RequestableVariable]: 
    description: Filtre une appétence précise
↓T_Referentiel_Domaines [transactions.SqlTransaction]: 
  comment: Domaines d'appétences (référentiel COE_Domaine).
  sqlQuery: |
    SELECT
        d.id AS id,
        d.id AS domaine_id,
        d.libelle,
        COALESCE(d.tone, '') AS tone,
        d.id_perimetre
    FROM "COE_Domaine" d
    JOIN "COE_Communaute" p ON p.id = d.id_perimetre
    WHERE p.active = true
      AND ('{id_perimetre}' = '' OR d.id_perimetre = '{id_perimetre}')
      AND ('{id_communaute}' = '' OR p.parent_id = '{id_communaute}')
    ORDER BY d.libelle;
  ↓id_perimetre [variables.RequestableVariable]: 
    description: Périmètre (vide = tous)
  ↓id_communaute [variables.RequestableVariable]: 
    description: Communauté parente (posée par la séquence, pas par le client)
↓T_Referentiel_Listes [transactions.SqlTransaction]: 
  comment: Valeurs distinctes sites, périmètres, postes et entités (listes déroulantes).
  sqlQuery: |
    SELECT 'site' AS liste, f.site AS valeur
    FROM "COE_Fiche" f
    JOIN "COE_Membre" m ON m.code_agent = f.user_id
    WHERE f.site IS NOT NULL AND TRIM(f.site) <> ''
      AND ('{id_communaute}' = '' OR m.id_communaute = '{id_communaute}')
    GROUP BY f.site
    UNION ALL
    SELECT 'perimetre', p.libelle
    FROM "COE_Communaute" p
    WHERE p.parent_id IS NOT NULL
      AND p.active = true
      AND ('{id_communaute}' = '' OR p.parent_id = '{id_communaute}')
    GROUP BY p.libelle
    UNION ALL
    SELECT 'poste', f.libelle_poste
    FROM "COE_Fiche" f
    JOIN "COE_Membre" m ON m.code_agent = f.user_id
    WHERE f.libelle_poste IS NOT NULL AND TRIM(f.libelle_poste) <> ''
      AND ('{id_communaute}' = '' OR m.id_communaute = '{id_communaute}')
    GROUP BY f.libelle_poste
    UNION ALL
    SELECT 'entite', f.entite_operationnelle
    FROM "COE_Fiche" f
    JOIN "COE_Membre" m ON m.code_agent = f.user_id
    WHERE f.entite_operationnelle IS NOT NULL AND TRIM(f.entite_operationnelle) <> ''
      AND ('{id_communaute}' = '' OR m.id_communaute = '{id_communaute}')
    GROUP BY f.entite_operationnelle
    ORDER BY liste, valeur;
  ↓id_communaute [variables.RequestableVariable]: 
    description: Communauté parente (posée par la séquence)
↓T_Referentiel_Termes [transactions.SqlTransaction]: 
  comment: Termes / appétences d'une communauté (code ou id).
  sqlQuery: |
    SELECT
        t.id AS id,
        t.id AS terme_id,
        t.libelle,
        t.statut,
        COALESCE(t.domaine_id, '') AS domaine_id,
        COALESCE(t.icon, '') AS icon,
        p.parent_id AS id_communaute,
        t.id_perimetre,
        p.libelle AS perimetre
    FROM "COE_Terme" t
    JOIN "COE_Communaute" p ON p.id = t.id_perimetre
    WHERE p.active = true
      AND (
        t.statut = 'valide'
        OR (
          t.statut = 'propose'
          AND EXISTS (
            SELECT 1 FROM "COE_FicheTerme" ft WHERE ft.terme_id = t.id
          )
        )
      )
      AND ('{id_perimetre}' = '' OR t.id_perimetre = '{id_perimetre}')
      AND (
        '{id_communaute}' = ''
        OR p.parent_id = '{id_communaute}'
        OR p.id = '{id_communaute}'
      )
      AND ('{statut}' = '' OR t.statut = '{statut}')
    ORDER BY t.libelle;
  ↓id_perimetre [variables.RequestableVariable]: 
    description: Périmètre de travail
  ↓id_communaute [variables.RequestableVariable]: 
    description: Communauté parente
  ↓statut [variables.RequestableVariable]: 
    description: Filtre statut valide|propose|refuse|archive (optionnel)
↓T_Terme_Proposer [transactions.SqlTransaction]: 
  comment: Crée un terme proposé et l attache à la fiche du membre.
  sqlQuery: |
    WITH c AS (
        SELECT m.id_perimetre, m.code_agent
        FROM "COE_Membre" m
        WHERE UPPER(m.code_agent) = UPPER('{code_agent}')
          AND m.actif = true
        LIMIT 1
    ),
    doublon AS (
        SELECT t.id, COALESCE(d.libelle, '') AS domaine
        FROM "COE_Terme" t
        JOIN c ON c.id_perimetre = t.id_perimetre
        LEFT JOIN "COE_Domaine" d ON d.id = t.domaine_id
        WHERE t.statut <> 'archive'
          AND lower(regexp_replace(btrim(t.libelle), '[[:space:]]+', ' ', 'g'))
              = lower(regexp_replace(btrim('{libelle}'), '[[:space:]]+', ' ', 'g'))
    ),
    ins AS (
        INSERT INTO "COE_Terme" (id, id_perimetre, libelle, statut, domaine_id)
        SELECT
            't-' || substr(md5(random()::text || clock_timestamp()::text), 1, 12),
            c.id_perimetre,
            TRIM('{libelle}'),
            'propose',
            d.id
        FROM c
        JOIN "COE_Domaine" d
          ON d.id = NULLIF('{domaine_id}', '')
         AND d.id_perimetre = c.id_perimetre
        WHERE NOT EXISTS (SELECT 1 FROM doublon)
        RETURNING id, libelle, domaine_id, statut
    ),
    link AS (
        INSERT INTO "COE_FicheTerme" (fiche_user_id, terme_id)
        SELECT c.code_agent, ins.id
        FROM c, ins
        WHERE EXISTS (SELECT 1 FROM "COE_Fiche" f WHERE f.user_id = c.code_agent)
        ON CONFLICT DO NOTHING
        RETURNING terme_id
    )
    SELECT
        COALESCE((SELECT ins.id FROM ins), '') AS terme_id,
        EXISTS (SELECT 1 FROM doublon) AS deja_present,
        COALESCE((SELECT string_agg(DISTINCT domaine, ', ') FROM doublon), '') AS domaines,
        EXISTS (SELECT 1 FROM link) AS rattache;
