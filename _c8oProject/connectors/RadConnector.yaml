↓T_Structure_Enregistrer [transactions.SqlTransaction]: 
  comment: Cree ou renomme une communaute ou un perimetre. Id genere cote serveur.
  sqlQuery: |
    WITH acteur AS (
        SELECT m.code_agent, m.role_session, m.pilote_communaute, m.role_local, m.id_communaute, m.id_perimetre
        FROM "COE_Membre" m
        WHERE m.actif = true AND UPPER(m.code_agent) = UPPER('{session_user}')
        LIMIT 1
    ),
    droit AS (
        SELECT CASE
            WHEN NOT EXISTS (SELECT 1 FROM acteur) THEN 'non'
            WHEN '{action}' IN ('creer_communaute', 'desactiver') AND (SELECT role_session FROM acteur) = 'admin' THEN 'oui'
            WHEN '{action}' = 'creer_perimetre' AND (
                (SELECT role_session FROM acteur) = 'admin'
                OR ((SELECT pilote_communaute FROM acteur) = true AND (SELECT id_communaute FROM acteur) = '{parent_id}')
            ) THEN 'oui'
            WHEN '{action}' = 'renommer' AND (
                (SELECT role_session FROM acteur) = 'admin'
                OR (
                    (SELECT pilote_communaute FROM acteur) = true
                    AND (
                        '{node_id}' = (SELECT id_communaute FROM acteur)
                        OR EXISTS (
                            SELECT 1 FROM "COE_Communaute" c
                            WHERE c.id = '{node_id}' AND c.parent_id = (SELECT id_communaute FROM acteur)
                        )
                    )
                )
            ) THEN 'oui'
            ELSE 'non'
        END AS ok
    ),
    ins AS (
        INSERT INTO "COE_Communaute" (id, libelle, active, parent_id)
        SELECT
            CASE WHEN '{action}' = 'creer_communaute' THEN 'c-' ELSE 'p-' END || substr(md5(random()::text || clock_timestamp()::text), 1, 10),
            btrim('{libelle}'),
            true,
            CASE WHEN '{action}' = 'creer_perimetre' THEN NULLIF('{parent_id}', '') ELSE NULL END
        WHERE (SELECT ok FROM droit) = 'oui'
          AND '{action}' IN ('creer_communaute', 'creer_perimetre')
          AND length(btrim('{libelle}')) > 0
          AND (
            '{action}' = 'creer_communaute'
            OR EXISTS (
                SELECT 1 FROM "COE_Communaute" parent
                WHERE parent.id = '{parent_id}' AND parent.parent_id IS NULL AND parent.active = true
            )
          )
        RETURNING id
    ),
    maj AS (
        UPDATE "COE_Communaute" c
        SET libelle = btrim('{libelle}')
        WHERE (SELECT ok FROM droit) = 'oui'
          AND '{action}' = 'renommer'
          AND c.id = '{node_id}'
          AND length(btrim('{libelle}')) > 0
        RETURNING c.id
    ),
    ext AS (
        UPDATE "COE_Communaute" c
        SET active = ('{actif}' = 'oui')
        WHERE (SELECT ok FROM droit) = 'oui'
          AND '{action}' = 'desactiver'
          AND (c.id = '{node_id}' OR c.parent_id = '{node_id}')
        RETURNING c.id
    )
    SELECT
        CASE
            WHEN (SELECT ok FROM droit) = 'oui' AND (EXISTS (SELECT 1 FROM ins) OR EXISTS (SELECT 1 FROM maj) OR EXISTS (SELECT 1 FROM ext)) THEN 'oui'
            ELSE 'non'
        END AS ok,
        CASE
            WHEN (SELECT ok FROM droit) <> 'oui' THEN 'Action non autorisee'
            WHEN '{action}' IN ('creer_communaute', 'creer_perimetre', 'renommer') AND length(btrim('{libelle}')) = 0 THEN 'Saisissez un nom'
            WHEN NOT (EXISTS (SELECT 1 FROM ins) OR EXISTS (SELECT 1 FROM maj) OR EXISTS (SELECT 1 FROM ext)) THEN 'Enregistrement refuse'
            ELSE ''
        END AS message,
        COALESCE((SELECT id FROM ins LIMIT 1), (SELECT id FROM maj LIMIT 1), (SELECT id FROM ext LIMIT 1), '') AS node_id
  ↓session_user [variables.RequestableVariable]: 
    description: Acteur de session
  ↓action [variables.RequestableVariable]: 
    description: creer_communaute, creer_perimetre, renommer ou desactiver
  ↓node_id [variables.RequestableVariable]: 
    description: Id cible pour renommer ou desactiver
  ↓parent_id [variables.RequestableVariable]: 
    description: Communaute parente pour un perimetre
  ↓libelle [variables.RequestableVariable]: 
    description: Nom affiche
  ↓actif [variables.RequestableVariable]: 
    description: oui ou non pour desactiver
↓T_Membre_Ajouter [transactions.SqlTransaction]: 
  comment: Ajoute un agent a une communaute et un perimetre. Refuse sans LibelleService ou si deja membre.
  sqlQuery: |
    WITH acteur AS (
        SELECT m.code_agent, m.role_session, m.pilote_communaute, m.role_local, m.id_communaute, m.id_perimetre
        FROM "COE_Membre" m
        WHERE m.actif = true AND UPPER(m.code_agent) = UPPER('{session_user}')
        LIMIT 1
    ),
    peri AS (
        SELECT p.id, p.parent_id, p.libelle
        FROM "COE_Communaute" p
        WHERE p.id = '{id_perimetre}' AND p.parent_id = '{id_communaute}' AND p.active = true AND p.parent_id IS NOT NULL
    ),
    agent AS (
        SELECT
            '{code_agent}' AS code_agent,
            '{nom}' AS nom,
            '{mail}' AS mail,
            '{site}' AS site,
            '{libelle_service}' AS libelle_service
        WHERE '{code_agent}' <> '' AND '{nom}' <> ''
    ),
    verdict AS (
        SELECT CASE
            WHEN NOT EXISTS (SELECT 1 FROM acteur) THEN 'Action non autorisee'
            WHEN NOT EXISTS (SELECT 1 FROM peri) THEN 'Perimetre invalide'
            WHEN NOT EXISTS (SELECT 1 FROM agent) THEN 'Agent introuvable'
            WHEN COALESCE(btrim((SELECT libelle_service FROM agent)), '') = '' THEN 'Ajout bloque : pas de LibelleService'
            WHEN EXISTS (
                SELECT 1 FROM "COE_Membre" m
                WHERE UPPER(m.code_agent) = UPPER((SELECT code_agent FROM agent)) AND m.actif = true
            ) THEN 'Cette personne a deja une appartenance active'
            WHEN '{role}' NOT IN ('membre', 'pilote_perimetre', 'pilote_communaute') THEN 'Role invalide'
            WHEN (SELECT role_session FROM acteur) = 'admin' THEN ''
            WHEN (SELECT pilote_communaute FROM acteur) = true AND (SELECT id_communaute FROM acteur) = '{id_communaute}' THEN ''
            WHEN (SELECT role_local FROM acteur) = 'pilote' AND (SELECT id_perimetre FROM acteur) = '{id_perimetre}' AND '{role}' = 'membre' THEN ''
            WHEN (SELECT role_local FROM acteur) = 'pilote' AND (SELECT id_perimetre FROM acteur) = '{id_perimetre}' THEN 'Seul le pilote de la communaute peut nommer un pilote'
            ELSE 'Action non autorisee'
        END AS message
    ),
    ins_m AS (
        INSERT INTO "COE_Membre" (
            code_agent, nom_affiche, mail, site, id_communaute, id_perimetre,
            role_local, pilote_communaute, role_session, actif
        )
        SELECT
            a.code_agent,
            a.nom,
            a.mail,
            a.site,
            '{id_communaute}',
            '{id_perimetre}',
            CASE WHEN '{role}' IN ('pilote_perimetre', 'pilote_communaute') THEN 'pilote' ELSE 'membre' END,
            CASE WHEN '{role}' = 'pilote_communaute' THEN true ELSE false END,
            'membre',
            true
        FROM agent a
        WHERE (SELECT message FROM verdict) = ''
        ON CONFLICT (code_agent) DO UPDATE SET
            nom_affiche = EXCLUDED.nom_affiche,
            mail = EXCLUDED.mail,
            site = EXCLUDED.site,
            id_communaute = EXCLUDED.id_communaute,
            id_perimetre = EXCLUDED.id_perimetre,
            role_local = EXCLUDED.role_local,
            pilote_communaute = EXCLUDED.pilote_communaute,
            actif = true
        RETURNING code_agent, id_perimetre
    ),
    ins_f AS (
        INSERT INTO "COE_Fiche" (
            user_id, nom_affiche, mail_si, site, id_perimetre, entite_operationnelle, canal_mail, canal_teams
        )
        SELECT m.code_agent, '{nom}', '{mail}', '{site}', m.id_perimetre, '{libelle_service}', '{mail}', '{mail}'
        FROM ins_m m
        ON CONFLICT (user_id) DO UPDATE SET
            nom_affiche = EXCLUDED.nom_affiche,
            mail_si = EXCLUDED.mail_si,
            site = EXCLUDED.site,
            id_perimetre = EXCLUDED.id_perimetre,
            entite_operationnelle = EXCLUDED.entite_operationnelle,
            canal_mail = COALESCE(NULLIF("COE_Fiche".canal_mail, ''), EXCLUDED.canal_mail),
            canal_teams = COALESCE(NULLIF("COE_Fiche".canal_teams, ''), EXCLUDED.canal_teams),
            updated_at = now()
        RETURNING user_id
    )
    SELECT
        CASE WHEN (SELECT message FROM verdict) = '' AND EXISTS (SELECT 1 FROM ins_m) THEN 'oui' ELSE 'non' END AS ok,
        CASE
            WHEN (SELECT message FROM verdict) <> '' THEN (SELECT message FROM verdict)
            WHEN NOT EXISTS (SELECT 1 FROM ins_m) THEN 'Enregistrement refuse'
            ELSE ''
        END AS message,
        COALESCE((SELECT code_agent FROM ins_m LIMIT 1), '') AS code_agent
