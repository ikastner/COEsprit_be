↓T_Fiche_Appetences [transactions.SqlTransaction]: 
  comment: Appétences d'une fiche, une ligne par terme (pas une chaîne).
  sqlQuery: |
    SELECT
        t.id,
        t.libelle,
        t.statut,
        COALESCE(t.domaine_id, '') AS domaine_id,
        COALESCE(d.libelle, '') AS domaine,
        COALESCE(d.tone, '') AS tone,
        COALESCE(t.icon, '') AS icon
    FROM "COE_FicheTerme" ft
    JOIN "COE_Terme" t ON t.id = ft.terme_id
    LEFT JOIN "COE_Domaine" d ON d.id = t.domaine_id
    WHERE UPPER(ft.fiche_user_id) = UPPER('{user_id}')
      AND t.statut <> 'archive'
    ORDER BY d.libelle, t.libelle;
  ↓user_id [variables.RequestableVariable]: 
    description: Code agent fiche
↓T_Fiche_Enregistrer [transactions.SqlTransaction]: 
  comment: Crée ou met à jour une fiche profil (upsert sur user_id).
  sqlQuery: |
    INSERT INTO "COE_Fiche" (
        user_id, nom_affiche, mail_si, site, id_perimetre, entite_operationnelle,
        libelle_poste, activites_principales, sujets_aide, passions,
        canal_mail, canal_teams, photo_url, updated_at
    )
    SELECT
        m.code_agent,
        COALESCE(NULLIF('{nom_affiche}', ''), m.nom_affiche),
        COALESCE(NULLIF('{mail_si}', ''), m.mail),
        m.site,
        m.id_perimetre,
        NULLIF('{entite_operationnelle}', ''),
        NULLIF('{libelle_poste}', ''),
        NULLIF('{activites_principales}', ''),
        NULLIF('{sujets_aide}', ''),
        NULLIF('{passions}', ''),
        NULLIF('{canal_mail}', ''),
        NULLIF('{canal_teams}', ''),
        NULLIF('{photo_url}', ''),
        now()
    FROM "COE_Membre" m
    WHERE UPPER(m.code_agent) = UPPER('{user_id}')
      AND m.actif = true
    ON CONFLICT (user_id) DO UPDATE SET
        nom_affiche = COALESCE(EXCLUDED.nom_affiche, "COE_Fiche".nom_affiche),
        mail_si = COALESCE(EXCLUDED.mail_si, "COE_Fiche".mail_si),
        libelle_poste = COALESCE(EXCLUDED.libelle_poste, "COE_Fiche".libelle_poste),
        activites_principales = COALESCE(EXCLUDED.activites_principales, "COE_Fiche".activites_principales),
        sujets_aide = COALESCE(EXCLUDED.sujets_aide, "COE_Fiche".sujets_aide),
        passions = COALESCE(EXCLUDED.passions, "COE_Fiche".passions),
        canal_mail = COALESCE(EXCLUDED.canal_mail, "COE_Fiche".canal_mail),
        canal_teams = COALESCE(EXCLUDED.canal_teams, "COE_Fiche".canal_teams),
        photo_url = COALESCE(EXCLUDED.photo_url, "COE_Fiche".photo_url),
        updated_at = now()
    RETURNING user_id, updated_at;
  ↓user_id [variables.RequestableVariable]: 
    description: Code agent membre
  ↓nom_affiche [variables.RequestableVariable]: 
    description: Nom affiché
  ↓mail_si [variables.RequestableVariable]: 
    description: Mail SI
  ↓site [variables.RequestableVariable]: 
    description: Site
  ↓perimetre [variables.RequestableVariable]: 
    description: Ignoré — le périmètre vient du membre
  ↓entite_operationnelle [variables.RequestableVariable]: 
    description: Entité opérationnelle, posée seulement à la création
  ↓libelle_poste [variables.RequestableVariable]: 
    description: Libellé poste
  ↓activites_principales [variables.RequestableVariable]: 
    description: Activités principales
  ↓sujets_aide [variables.RequestableVariable]: 
    description: Sujets d'aide
  ↓passions [variables.RequestableVariable]: 
    description: Passions
  ↓canal_mail [variables.RequestableVariable]: 
    description: Canal mail
  ↓canal_teams [variables.RequestableVariable]: 
    description: Canal Teams
  ↓photo_url [variables.RequestableVariable]: 
    description: Base64 de la photo, sans préfixe data
↓T_Fiche_Indicateurs [transactions.SqlTransaction]: 
  comment: Même site et appétences uniques, dans la communauté de la fiche consultée.
  sqlQuery: |
    SELECT
        f.user_id,
        (
            SELECT COUNT(*)
            FROM "COE_Fiche" f2
            JOIN "COE_Membre" m2 ON m2.code_agent = f2.user_id
            WHERE m2.actif = true
              AND m2.id_communaute = m.id_communaute
              AND upper(f2.user_id) <> upper(f.user_id)
              AND trim(COALESCE(f.site, '')) <> ''
              AND lower(trim(COALESCE(f2.site, ''))) = lower(trim(f.site))
        ) AS meme_site,
        (
            SELECT COUNT(*)
            FROM "COE_FicheTerme" ft
            WHERE ft.fiche_user_id = f.user_id
              AND NOT EXISTS (
                  SELECT 1
                  FROM "COE_FicheTerme" ft2
                  JOIN "COE_Membre" m2 ON m2.code_agent = ft2.fiche_user_id
                  WHERE m2.actif = true
                    AND m2.id_communaute = m.id_communaute
                    AND upper(ft2.fiche_user_id) <> upper(f.user_id)
                    AND ft2.terme_id = ft.terme_id
              )
        ) AS appetences_uniques
    FROM "COE_Fiche" f
    JOIN "COE_Membre" m ON m.code_agent = f.user_id
    JOIN "COE_Membre" ms ON upper(ms.code_agent) = upper(trim('{session_user}'))
    WHERE upper(f.user_id) = upper(trim('{user_id}'))
      AND m.actif = true
      AND ms.actif = true
      AND m.id_communaute = ms.id_communaute;
