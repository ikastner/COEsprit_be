↓T_Terme_Creer [transactions.SqlTransaction]: 
  comment: Cree une appetence validee dans le perimetre.
  sqlQuery: |
    WITH droit AS (
        SELECT CASE WHEN (
        EXISTS (
            SELECT 1 FROM "COE_Membre" a
            WHERE a.actif = true
              AND UPPER(a.code_agent) = UPPER('{session_user}')
              AND (
                a.role_session = 'admin'
                OR (a.pilote_communaute = true AND a.id_communaute = (SELECT c.parent_id FROM "COE_Communaute" c WHERE c.id = '{id_perimetre}'))
                OR (a.role_local = 'pilote' AND a.id_perimetre = '{id_perimetre}')
              )
        )
    ) THEN 'oui' ELSE 'non' END AS ok
    ),
    ins AS (
        INSERT INTO "COE_Terme" (id, id_perimetre, libelle, statut, domaine_id)
        SELECT
            't-' || substr(md5(random()::text || clock_timestamp()::text), 1, 12),
            '{id_perimetre}',
            btrim('{libelle}'),
            'valide',
            NULLIF('{domaine_id}', '')
        WHERE (SELECT ok FROM droit) = 'oui'
          AND length(btrim('{libelle}')) > 0
          AND EXISTS (
            SELECT 1 FROM "COE_Domaine" d
            WHERE d.id = '{domaine_id}' AND d.id_perimetre = '{id_perimetre}'
          )
          AND NOT EXISTS (
            SELECT 1 FROM "COE_Terme" t
            WHERE t.id_perimetre = '{id_perimetre}'
              AND t.statut <> 'archive'
              AND lower(regexp_replace(btrim(t.libelle), '[[:space:]]+', ' ', 'g'))
                  = lower(regexp_replace(btrim('{libelle}'), '[[:space:]]+', ' ', 'g'))
          )
        RETURNING id
    )
    SELECT
        CASE WHEN EXISTS (SELECT 1 FROM ins) THEN 'oui' ELSE 'non' END AS ok,
        CASE
            WHEN (SELECT ok FROM droit) <> 'oui' THEN 'Action non autorisee'
            WHEN length(btrim('{libelle}')) = 0 THEN 'Saisissez un nom'
            WHEN NOT EXISTS (SELECT 1 FROM ins) THEN 'Enregistrement refuse'
            ELSE ''
        END AS message,
        COALESCE((SELECT id FROM ins LIMIT 1), '') AS terme_id
  ↓session_user [variables.RequestableVariable]: 
    description: Acteur de session
  ↓id_perimetre [variables.RequestableVariable]: 
    description: Perimetre
  ↓domaine_id [variables.RequestableVariable]: 
    description: Domaine
  ↓libelle [variables.RequestableVariable]: 
    description: Nom de l appetence
↓T_Terme_Renommer [transactions.SqlTransaction]: 
  comment: Renomme une appetence du perimetre.
  sqlQuery: |
    WITH terme AS (
        SELECT t.id, t.id_perimetre
        FROM "COE_Terme" t
        WHERE t.id = '{terme_id}'
    ),
    droit AS (
        SELECT CASE WHEN EXISTS (
            SELECT 1 FROM "COE_Membre" a
            JOIN terme t ON true
            JOIN "COE_Communaute" p ON p.id = t.id_perimetre
            WHERE a.actif = true
              AND UPPER(a.code_agent) = UPPER('{session_user}')
              AND (
                a.role_session = 'admin'
                OR (a.pilote_communaute = true AND a.id_communaute = p.parent_id)
                OR (a.role_local = 'pilote' AND a.id_perimetre = t.id_perimetre)
              )
        ) THEN 'oui' ELSE 'non' END AS ok
    ),
    maj AS (
        UPDATE "COE_Terme" t
        SET libelle = btrim('{libelle}')
        WHERE (SELECT ok FROM droit) = 'oui'
          AND t.id = '{terme_id}'
          AND length(btrim('{libelle}')) > 0
          AND NOT EXISTS (
            SELECT 1 FROM "COE_Terme" o
            WHERE o.id_perimetre = t.id_perimetre
              AND o.id <> t.id
              AND o.statut <> 'archive'
              AND lower(btrim(o.libelle)) = lower(btrim('{libelle}'))
          )
        RETURNING t.id
    )
    SELECT
        CASE WHEN EXISTS (SELECT 1 FROM maj) THEN 'oui' ELSE 'non' END AS ok,
        CASE
            WHEN (SELECT ok FROM droit) <> 'oui' THEN 'Action non autorisee'
            WHEN length(btrim('{libelle}')) = 0 THEN 'Saisissez un nom'
            WHEN NOT EXISTS (SELECT 1 FROM terme) THEN 'Appetence introuvable'
            WHEN NOT EXISTS (SELECT 1 FROM maj) THEN 'Enregistrement refuse'
            ELSE ''
        END AS message,
        COALESCE((SELECT id FROM maj LIMIT 1), '') AS terme_id
  ↓session_user [variables.RequestableVariable]: 
    description: Acteur de session
  ↓terme_id [variables.RequestableVariable]: 
    description: Terme
  ↓libelle [variables.RequestableVariable]: 
