            WHERE a.actif = true
              AND UPPER(a.code_agent) = UPPER('{session_user}')
              AND (
                a.role_session = 'admin'
                OR (a.pilote_communaute = true AND a.id_communaute = (SELECT c.parent_id FROM "COE_Communaute" c WHERE c.id = '{id_perimetre}'))
                OR (a.role_local = 'pilote' AND a.id_perimetre = '{id_perimetre}')
              )
        )
    ) THEN 'oui' ELSE 'non' END AS ok
    ),
    ins AS (
        INSERT INTO "COE_Domaine" (id, id_perimetre, libelle, tone)
        SELECT
            'd-' || substr(md5(random()::text || clock_timestamp()::text), 1, 10),
            '{id_perimetre}',
            btrim('{libelle}'),
            'sky'
        WHERE (SELECT ok FROM droit) = 'oui'
          AND '{action}' = 'creer'
          AND length(btrim('{libelle}')) > 0
          AND EXISTS (SELECT 1 FROM "COE_Communaute" p WHERE p.id = '{id_perimetre}' AND p.parent_id IS NOT NULL)
          AND NOT EXISTS (
            SELECT 1 FROM "COE_Domaine" d
            WHERE d.id_perimetre = '{id_perimetre}'
              AND lower(btrim(d.libelle)) = lower(btrim('{libelle}'))
          )
        RETURNING id
    ),
    maj AS (
        UPDATE "COE_Domaine" d
        SET libelle = btrim('{libelle}')
        WHERE (SELECT ok FROM droit) = 'oui'
          AND '{action}' = 'renommer'
          AND d.id = '{node_id}'
          AND d.id_perimetre = '{id_perimetre}'
          AND length(btrim('{libelle}')) > 0
        RETURNING d.id
    )
    SELECT
        CASE WHEN (SELECT ok FROM droit) = 'oui' AND (EXISTS (SELECT 1 FROM ins) OR EXISTS (SELECT 1 FROM maj)) THEN 'oui' ELSE 'non' END AS ok,
        CASE
            WHEN (SELECT ok FROM droit) <> 'oui' THEN 'Action non autorisee'
            WHEN length(btrim('{libelle}')) = 0 THEN 'Saisissez un nom'
            WHEN NOT (EXISTS (SELECT 1 FROM ins) OR EXISTS (SELECT 1 FROM maj)) THEN 'Enregistrement refuse'
            ELSE ''
        END AS message,
        COALESCE((SELECT id FROM ins LIMIT 1), (SELECT id FROM maj LIMIT 1), '') AS node_id
  ↓session_user [variables.RequestableVariable]: 
