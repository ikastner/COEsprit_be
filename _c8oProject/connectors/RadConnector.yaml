↓T_Structure_Lire [transactions.SqlTransaction]: 
  comment: Arbre communaute et perimetre visible selon le role.
  sqlQuery: |
    WITH acteur AS (
        SELECT m.code_agent, m.role_session, m.pilote_communaute, m.role_local, m.id_communaute, m.id_perimetre
        FROM "COE_Membre" m
        WHERE m.actif = true AND UPPER(m.code_agent) = UPPER('{session_user}')
        LIMIT 1
    )
    SELECT
        c.id,
        c.libelle,
        COALESCE(c.parent_id, '') AS parent_id,
        CASE WHEN c.active THEN 'oui' ELSE 'non' END AS active,
        CASE WHEN c.parent_id IS NULL THEN 'communaute' ELSE 'perimetre' END AS kind,
        CASE WHEN c.parent_id IS NULL
            THEN (SELECT count(*) FROM "COE_Membre" mb WHERE mb.actif = true AND mb.id_communaute = c.id)
            ELSE (SELECT count(*) FROM "COE_Membre" mb WHERE mb.actif = true AND mb.id_perimetre = c.id)
        END AS nb_membres
    FROM "COE_Communaute" c
    JOIN acteur s ON true
    WHERE (
        s.role_session = 'admin'
        OR (s.pilote_communaute = true AND (c.id = s.id_communaute OR c.parent_id = s.id_communaute))
        OR (s.role_local = 'pilote' AND (c.id = s.id_perimetre OR c.id = s.id_communaute))
    )
    AND (s.role_session = 'admin' OR c.active = true)
    ORDER BY c.parent_id NULLS FIRST, c.libelle
