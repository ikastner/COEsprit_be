↓T_Membre_Retirer [transactions.SqlTransaction]: 
  comment: Desactive l appartenance. Refuse le retrait du dernier pilote de perimetre.
  sqlQuery: |
    WITH acteur AS (
        SELECT m.code_agent, m.role_session, m.pilote_communaute, m.role_local, m.id_communaute, m.id_perimetre
        FROM "COE_Membre" m
        WHERE m.actif = true AND UPPER(m.code_agent) = UPPER('{session_user}')
        LIMIT 1
    ),
    cible AS (
        SELECT m.code_agent, m.role_local, m.id_communaute, m.id_perimetre
        FROM "COE_Membre" m
        WHERE UPPER(m.code_agent) = UPPER('{code_agent}') AND m.actif = true
        LIMIT 1
    ),
    verdict AS (
        SELECT CASE
            WHEN NOT EXISTS (SELECT 1 FROM acteur) THEN 'Action non autorisee'
            WHEN NOT EXISTS (SELECT 1 FROM cible) THEN 'Membre introuvable'
            WHEN NOT (
                (SELECT role_session FROM acteur) = 'admin'
                OR ((SELECT pilote_communaute FROM acteur) = true AND (SELECT id_communaute FROM acteur) = (SELECT id_communaute FROM cible))
                OR ((SELECT role_local FROM acteur) = 'pilote' AND (SELECT id_perimetre FROM acteur) = (SELECT id_perimetre FROM cible))
            ) THEN 'Action non autorisee'
            WHEN (SELECT role_local FROM cible) = 'pilote'
             AND (
                SELECT count(*) FROM "COE_Membre" x
                WHERE x.actif = true AND x.role_local = 'pilote' AND x.id_perimetre = (SELECT id_perimetre FROM cible)
             ) <= 1
            THEN 'Impossible : dernier pilote du perimetre'
            ELSE ''
        END AS message
    ),
    maj AS (
        UPDATE "COE_Membre" m
        SET actif = false
        WHERE (SELECT message FROM verdict) = ''
          AND UPPER(m.code_agent) = UPPER('{code_agent}')
          AND m.actif = true
        RETURNING m.code_agent
    )
    SELECT
        CASE WHEN (SELECT message FROM verdict) = '' AND EXISTS (SELECT 1 FROM maj) THEN 'oui' ELSE 'non' END AS ok,
        CASE
            WHEN (SELECT message FROM verdict) <> '' THEN (SELECT message FROM verdict)
            ELSE ''
        END AS message,
        COALESCE((SELECT code_agent FROM maj LIMIT 1), '') AS code_agent
