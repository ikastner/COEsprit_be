↓Valider [steps.SimpleStep-1798100800006]: 
  expression: |
    'function cid(v) {
      var s = String(v == null ? "" : v);
      var out = "";
      var i = 0;
      for (i = 0; i < s.length; i++) {
        var n = s.charCodeAt(i);
        var ok = (n >= 48 && n <= 57) || (n >= 65 && n <= 90) || (n >= 97 && n <= 122) || n === 45 || n === 95;
        if (ok) out += s.charAt(i);
      }
      return out;
    }
    function ctxt(v) {
      var s = String(v == null ? "" : v);
      var out = "";
      var sp = false;
      var i = 0;
      for (i = 0; i < s.length; i++) {
        var n = s.charCodeAt(i);
        if (n === 39) { out += String.fromCharCode(39) + String.fromCharCode(39); sp = false; continue; }
        if (n === 59 || n === 37 || n === 95 || n === 92 || n === 123 || n === 125) { sp = true; continue; }
        if (n === 32 || n === 9 || n === 10 || n === 13) { sp = true; continue; }
        if (sp && out.length) out += " ";
        sp = false;
        out += s.charAt(i);
      }
      return out;
    }
    sessionUser = cid(acteurSession);
    session_user = sessionUser;
    action = cid(typeof action === "undefined" ? "" : action);
    node_id = cid(typeof node_id === "undefined" ? "" : node_id);
    id_perimetre = cid(typeof id_perimetre === "undefined" ? "" : id_perimetre);
    libelle = ctxt(typeof libelle === "undefined" ? "" : libelle);
    errMsg = "";
    if (sessionUser === "") errMsg = "Session invalide.";
    else if (action !== "creer" && action !== "renommer") errMsg = "Action inconnue.";
    else if (id_perimetre === "") errMsg = "Perimetre manquant.";
    '
