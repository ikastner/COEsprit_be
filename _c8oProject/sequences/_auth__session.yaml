↓Identifier [steps.SimpleStep-1795300000003]: 
  expression: |
    'function txt(v) {
        if (v == null) return "";
        var s = String(v).trim();
        return (s === "undefined" || s === "null") ? "" : s;
    }
    var d = sessionDoc;
    if (d && d.document) d = d.document;
    var u = (d && d.user) ? d.user : null;
    codeActeur = "";
    nomActeur = "";
    if (d && !d.error && u) {
        codeActeur = txt(u.codeAgent);
        if (codeActeur === "") codeActeur = txt(d.authenticatedUserID);
        nomActeur = txt(u.displayName);
        if (nomActeur === "") nomActeur = (txt(u.prenom) + " " + txt(u.nom)).trim();
    }
    if (nomActeur === "") nomActeur = codeActeur;
    var q = String.fromCharCode(39);
    code = codeActeur.split(q).join(q + q).split(String.fromCharCode(123)).join("").split(String.fromCharCode(125)).join("");
    '
