↓Controler_annuaire [steps.SimpleStep-1797100000013]: 
  comment: Hors SI, le membre COE_Membre suffit. En SI, le compte doit exister dans l'annuaire et ne pas être désactivé.
  expression: |
    'var ag = [];
    if (typeof annuaireRaw !== "undefined" && annuaireRaw != null) ag = (typeof annuaireRaw.length === "number") ? annuaireRaw : [annuaireRaw];
    var horsSi = String(authHorsSI).toLowerCase() == "true";
    var dansAnnuaire = ag.length > 0 && ag[0].code_agent != null && String(ag[0].code_agent) !== "";
    refusAcces = "";
    if (codes === "") refusAcces = "Accès refusé : aucun membre CO''Esprit n’est associé à ce compte.";
    else if (!horsSi && !dansAnnuaire) refusAcces = "Accès refusé : compte absent de l’annuaire.";
    else if (dansAnnuaire && String(ag[0].desactive).toLowerCase() === "true") refusAcces = "Accès refusé : compte désactivé.";
    else if (dansAnnuaire) {
        var prenom = String(ag[0].prenom || "").trim();
        if (prenom) nomActeur = prenom;
    }
    '
