↓Appliquer_ligne [steps.SimpleStep-1795300000023]: 
  expression: |
    'var rows = [];
    if (typeof ligneRaw !== "undefined" && ligneRaw != null) rows = (typeof ligneRaw.length === "number") ? ligneRaw : [ligneRaw];
    codes = "";
    idCommunaute = "";
    idPerimetre = "";
    if (rows.length > 0 && rows[0].cle != null && String(rows[0].cle) !== "") {
        var nomLigne = String(rows[0].nom || "").trim();
        if (!nomActeur || nomActeur === codeActeur) nomActeur = nomLigne || String(rows[0].cle);
        codes = String(rows[0].cle_externe || "").trim();
        codeActeur = String(rows[0].cle);
        idCommunaute = String(rows[0].id_communaute || "").trim();
        idPerimetre = String(rows[0].id_perimetre || "").trim();
    }
    '
