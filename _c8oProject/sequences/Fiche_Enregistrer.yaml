↓PrepIds [steps.SimpleStep-1798000300200]: 
  expression: |
    'var apos = String.fromCharCode(39);
    var semi = String.fromCharCode(59);
    function nettoyer(s) {
        return String(s == null ? "" : s).split(apos).join(apos + apos).split(semi).join(" ").split("{").join("").split("}").join("").trim();
    }
    var brut = String(terme_ids == null ? "" : terme_ids);
    var connus = brut.split(",").map(function (s) { return String(s).trim(); }).filter(function (s) { return s !== "" && s.indexOf("prop-") !== 0; });
    idsFinaux = connus.join(",");
    var props = [];
    try { props = JSON.parse(String(propositions == null || propositions === "" ? "[]" : propositions)); } catch (e) { props = []; }
    if (!props || typeof props.length !== "number") props = [];
    propsList = [];
    for (var i = 0; i < props.length; i++) {
        var p = props[i] || {};
        var lib = nettoyer(p.libelle || p.label);
        var dom = nettoyer(p.domaine_id || p.domaineId);
        if (lib !== "" && dom !== "") propsList.push({ libelle: lib, domaine_id: dom });
    }
    '
